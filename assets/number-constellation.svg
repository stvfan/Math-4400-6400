<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Number theoretic constellation</title>
  <desc id="desc">Concentric modular orbits, highlighted prime numbers, and classical congruences.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee5d4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#213d60"/>
      <stop offset="1" stop-color="#101e31"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#18222d" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M89 114C142 39 251 18 346 59c91-59 222-33 277 58 91 27 143 125 115 216 34 87-11 190-99 227-40 77-139 108-217 72-82 48-192 20-240-62-98-5-169-89-158-187-58-77-29-191 65-233z" fill="url(#paper)" stroke="#d5c8b1" stroke-width="2"/>
  </g>

  <g transform="translate(382 328)">
    <circle r="228" fill="none" stroke="#203a59" stroke-opacity=".13" stroke-width="2"/>
    <circle r="177" fill="none" stroke="#203a59" stroke-opacity=".18" stroke-width="2" stroke-dasharray="5 12"/>
    <circle r="126" fill="none" stroke="#8a4051" stroke-opacity=".26" stroke-width="2"/>
    <circle r="76" fill="url(#navy)" stroke="#c89f56" stroke-width="4"/>
    <text x="0" y="15" text-anchor="middle" fill="#fff8e9" font-family="Georgia, serif" font-size="58">ℤ</text>

    <g fill="#1c314b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" text-anchor="middle">
      <text x="0" y="-207">2</text><text x="108" y="-176">3</text><text x="190" y="-102">5</text>
      <text x="224" y="7">7</text><text x="191" y="116">11</text><text x="105" y="190">13</text>
      <text x="0" y="231">17</text><text x="-112" y="194">19</text><text x="-194" y="112">23</text>
      <text x="-225" y="7">29</text><text x="-190" y="-105">31</text><text x="-108" y="-180">37</text>
    </g>

    <g fill="#8a4051">
      <circle cx="0" cy="-228" r="7"/><circle cx="119" cy="-192" r="7"/><circle cx="207" cy="-111" r="7"/>
      <circle cx="244" cy="0" r="7"/><circle cx="207" cy="120" r="7"/><circle cx="117" cy="207" r="7"/>
      <circle cx="0" cy="249" r="7"/><circle cx="-120" cy="210" r="7"/><circle cx="-211" cy="121" r="7"/>
      <circle cx="-247" cy="0" r="7"/><circle cx="-210" cy="-121" r="7"/><circle cx="-120" cy="-210" r="7"/>
    </g>

    <g fill="#b58b3f">
      <circle cx="0" cy="-177" r="5"/><circle cx="153" cy="-89" r="5"/><circle cx="153" cy="89" r="5"/>
      <circle cx="0" cy="177" r="5"/><circle cx="-153" cy="89" r="5"/><circle cx="-153" cy="-89" r="5"/>
    </g>

    <path d="M0-228C152-205 244-126 244 0S152 205 0 249" fill="none" stroke="#b58b3f" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    <path d="M-210-121C-64-33 52 27 207 120" fill="none" stroke="#8a4051" stroke-opacity=".42" stroke-width="2"/>
  </g>

  <g font-family="Georgia, serif" fill="#23354a">
    <text x="67" y="92" font-size="24">gcd(a,b)</text>
    <text x="536" y="105" font-size="23">a ≡ b (mod n)</text>
    <text x="62" y="563" font-size="21">x² + y² = z²</text>
    <text x="490" y="575" font-size="21">φ(n) = n ∏(1 − 1/p)</text>
  </g>

  <g fill="#4f7065">
    <circle cx="105" cy="125" r="4"/><circle cx="624" cy="139" r="4"/>
    <circle cx="111" cy="526" r="4"/><circle cx="638" cy="531" r="4"/>
  </g>
</svg>
