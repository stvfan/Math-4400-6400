  quote: "God made the integers; all else is the work of man."
  quote_attribution: "Leopold Kronecker"

course_summary:
  paragraphs:
    - >-
      Number theory is the study of the integers (and related arithmetic objects) and the remarkable structures hidden inside them. 
      It is one of the oldest and most beautiful branches of mathematics. Although its questions are often easy to
      state, many have resisted centuries of effort.  
    - >- 
      This course invites you on a journey into the classical theory of numbers, with particular attention paid to the pathbreaking accomplishments of 
      the 18th and 19th centuries. Topics include divisibility, congruences, unique factorization, quadratic residues and quadratic 
      reciprocity, Gaussian integers, prime numbers, arithmetic functions, and selected advanced topics and applications.
    - >-
      Along the way, we will emphasize proof writing, mathematical communication, and the transition from 
      examples to general theorems.
  syllabus_label: "View the course syllabus"
  syllabus_href: "Syllabus.pdf"

textbook:
  title: "Fundamentals of Number Theory"
  author: "W. J. LeVeque"
  note: >-
    LeVeque's book covers the standard topics clearly and is remarkably
    inexpensive. You do not need the book for this course, but it is an
    excellent addition to any mathematical library.
  purchase_label: "Purchase"
  purchase_url: "https://www.amazon.com/dp/0486689069/"

