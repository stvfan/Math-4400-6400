course:
  code: "MATH 4400/6400"
  title: "Number Theory"
  semester: "Fall 2026"
  instructor: "Steve Fan"
  email: "Steve.Fan@uga.edu"
  meetings: "[MWF · 12:00PM–12:55PM]"
  room: "[Boyd · 302]"
  office_hours: "[MWF · 3pm–4pm]"
  office: "[Boyd · 321C]"
  quote: "God made the integers; all else is the work of man."
  quote_attribution: "Leopold Kronecker"

course_summary:
  paragraphs:
    - >-
      Number theory is the study of the positive integers and the remarkable
      structures hidden inside them. Although its questions are often easy to
      state, many have resisted centuries of effort. This course introduces
      divisibility, congruences, prime numbers, Diophantine equations,
      quadratic residues, and selected classical applications.
    - >-
      Along the way, we will emphasize proof writing, experimentation,
      mathematical communication, and the transition from examples to general
      theorems.
  syllabus_label: "View the course syllabus"
  syllabus_href: "syllabus.qmd"

textbook:
  title: "Fundamentals of Number Theory"
  author: "W. J. LeVeque"
  note: >-
    LeVeque's book covers the standard topics clearly and is remarkably
    inexpensive. You do not need the book for this course, but it is an
    excellent addition to any mathematical library.
  purchase_label: "Purchase"
  purchase_url: "https://www.amazon.com/dp/0486689069/"

# Keep newest lectures first. Add one entry after each class meeting.
# Attach the corresponding lecture notes using the links list.
lectures:
  - date: "September 10"
    meeting: "Lecture 5"
    title: "Bézout's identity and linear Diophantine equations"
    summary: >-
      We ran the extended Euclidean algorithm, interpreted its output as a
      certificate, and classified the integer solutions of ax+by=c.
    topics: ["gcd", "Bézout", "Diophantine equations"]
    links:
      - label: "Lecture notes"
        href: "notes/02-euclidean-algorithm.qmd"
  - date: "September 8"
    meeting: "Lecture 4"
    title: "The Euclidean algorithm"
    summary: >-
      We proved termination, computed several gcds, and compared the
      subtraction and remainder versions of the algorithm.
    topics: ["algorithm", "gcd", "remainders"]
    links:
      - label: "Lecture notes"
        href: "notes/02-euclidean-algorithm.qmd"
  - date: "September 5"
    meeting: "Lecture 3"
    title: "The division algorithm and proof design"
    summary: >-
      We used quotient-remainder representations to organize divisibility
      arguments and discussed how examples can reveal the right statement.
    topics: ["division algorithm", "proofs"]
    links:
      - label: "Lecture notes"
        href: "notes/01-divisibility.qmd"
  - date: "September 3"
    meeting: "Lecture 2"
    title: "Divisibility, quantifiers, and counterexamples"
    summary: >-
      We translated divisibility into equations, practiced negating quantified
      statements, and found counterexamples to tempting claims.
    topics: ["divisibility", "logic", "counterexamples"]
    links:
      - label: "Lecture notes"
        href: "notes/01-divisibility.qmd"
  - date: "August 29"
    meeting: "Lecture 1"
    title: "Why study the integers?"
    summary: >-
      We introduced the course, explored several elementary-looking open
      questions, and discussed the difference between evidence and proof.
    topics: ["course introduction", "conjectures"]
    links:
      - label: "Syllabus"
        href: "syllabus.qmd"

