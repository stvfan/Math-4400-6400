      normally be accepted, although early submission or an extension may be
      arranged in advance when circumstances require it. The lowest homework
      score will be dropped at the end of the term.
    - >-
      Collaboration is encouraged, but every student must understand and write
      the final solutions independently. You should be able to explain every
      submitted argument in detail.
  items:
    - number: "HW 1"
      title: "Divisibility and the Euclidean algorithm"
      due: "Friday, September 12 · 5:00 PM"
      status: "Assigned"
      status_style: "due"
      note: "Proof practice, gcd computations, and Bézout coefficients."
